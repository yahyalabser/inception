services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:inception
    env_file: .env
    volumes:
      - mariadb_db:/var/lib/mysql 
    networks:
      - docker-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure
  nginx :
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    networks:
      - docker-network
    volumes:
      - wordpress_db:/var/www/html
    ports:
      - "443:443"
    depends_on:
      - wordpress
    restart: on-failure

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    env_file: .env
    volumes:
      - wordpress_db:/var/www/html
    expose:
      - "9000"
    networks:
      - docker-network
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

volumes:
  wordpress_db :
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yahyalb/data/wordpress

  mariadb_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yahyalb/data/mariadb


networks:
  docker-network:
    driver: bridge
