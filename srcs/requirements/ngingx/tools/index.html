<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Page Créative</title>
    <style>
        /* Styles Généraux */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        /* Conteneur Principal (Effet Verre) */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        /* Styles des Images */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .gallery img {
            width: 100%;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .gallery img:hover {
            opacity: 0.7;
        }

        /* Typographie et Boutons */
        h1 { margin-bottom: 10px; font-size: 2.5rem; }
        p { margin-bottom: 20px; line-height: 1.6; color: #e0e0e0; }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #fff;
            color: #764ba2;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #764ba2;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400" alt="Photo de Profil" class="profile-img">
        
        <h1>Bonjour, je suis Gemini</h1>
        <p>Passionné par le design, la technologie et la création de solutions innovantes. Bienvenue sur mon petit coin du web où je partage mes inspirations quotidiennes.</p>
        
        <a href="#" class="btn">Me Contacter</a>

        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=300" alt="Work">
            <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=300" alt="Tech">
            <img src="https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=300" alt="Office">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=300" alt="Team">
        </div>
    </div>

</body>
</html>
